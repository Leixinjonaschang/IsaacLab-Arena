# Gr00tDatasetConfig for the Agibot handover_toast demonstrations recorded by
# isaaclab_arena_cumotion/scripts/handover_toast_cumotion.py --record-dir.

# Root directory the HDF5 lives in; the LeRobot dataset is written next to it, under
# <data_root>/<hdf5 stem>/lerobot/.
data_root: "/home/ubuntu/playground/datasets/handover_toast"

# Instruction given to the policy in natural language
language_instruction: "Pick up a slice of bread with the right hand and pass it to the left hand."
task_index: 0

# Name of the HDF5 file to use for the dataset
hdf5_name: "handover_toast.hdf5"

# Recorded HDF5 datafield names (see handover_toast_cumotion.py)
state_name_sim: "joint_pos"
action_name_sim: "processed_actions"
pov_cam_name_sim: "head_cam_rgb"

# Gr00t-LeRobot datafield names
state_name_lerobot: "observation.state"
action_name_lerobot: "action"
video_name_lerobot: "observation.images.ego_view"
task_description_lerobot: "annotation.human.action.task_description"

# Parquet configuration
chunks_size: 1000

# Video configuration. 15 fps because the demos are recorded at Arena's 15 Hz control rate: one
# frame per control step, so the videos play in real time and the policy's frame clock matches
# the actions'.
fps: 15

# File path templates
data_path: "data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet"
video_path: "videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4"

# Configuration file paths
modality_template_path: "isaaclab_arena_gr00t/embodiments/agibot/modality.json"
modality_fname: "modality.json"
episodes_fname: "episodes.jsonl"
tasks_fname: "tasks.jsonl"
info_template_path: "isaaclab_arena_gr00t/embodiments/agibot/info.json"
info_fname: "info.json"

# policy specific parameters (gr00t demonstration data stored in lerobot format)
policy_joints_config_path: "isaaclab_arena_gr00t/embodiments/agibot/gr00t_20dof_joint_space.yaml"
robot_type: "agibot"

# Robot simulation specific parameters
action_joints_config_path: "isaaclab_arena_gr00t/embodiments/agibot/20dof_joint_space.yaml"
state_joints_config_path: "isaaclab_arena_gr00t/embodiments/agibot/34dof_joint_space.yaml"

# Image configuration (height, width, channels)
original_image_size: [512, 512, 3]
target_image_size: [512, 512, 3]
