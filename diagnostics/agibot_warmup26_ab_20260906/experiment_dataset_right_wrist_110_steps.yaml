runs:
  agibot_stack_bowls_dataset_right_wrist_110_steps:
    environment:
      type: agibot_stack_bowls
      enable_cameras: true
      embodiment: agibot
      arm_mode: dual
      action_mode: gr00t_diffik
      policy_ready_arm_joint_positions:
        - -1.08173466
        - 0.590702653
        - 0.344096184
        - -1.28202832
        - 0.692764521
        - 0.827853262
        - 0.00000195965504
        - 1.08169997
        - -0.590699971
        - -0.344199985
        - 1.28190005
        - -0.692799985
        - -0.699999988
        - 0.0
      teleop_device: null
    environment_builder:
      language_instruction: Stack the bowls together.
    policy:
      type: isaaclab_arena_gr00t.policy.agibot_dataset_video_closedloop_probe_policy.AgibotDatasetVideoClosedloopProbePolicy
      policy_config_yaml_path: isaaclab_arena_gr00t/policy/config/agibot_n17_gr00t_closedloop_config.yaml
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 5558
      dataset_video_root: /tmp/agibot_dataset_video_probe/chunk-000
      dataset_episode_index: 78
      dataset_start_row: 0
      dataset_modalities:
        - right_wrist_view
    rollout_limit:
      num_steps: 110
