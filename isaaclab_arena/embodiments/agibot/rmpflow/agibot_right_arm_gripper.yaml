# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - right_arm_joint1
    - right_arm_joint2
    - right_arm_joint3
    - right_arm_joint4
    - right_arm_joint5
    - right_arm_joint6
    - right_arm_joint7

default_q: [
     1.0817, -0.5907, -0.3442, 1.2819, -0.6928, -0.7, 0.0
    ]

acceleration_limits: [
   10,10,10,10,10,10,10
]

jerk_limits: [
   10000,10000,10000,10000,10000,10000,10000
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.


cspace_to_urdf_rules:
    - {name: joint_lift_body, rule: fixed, value: 0.1995}
    - {name: joint_body_pitch, rule: fixed, value: 0.6025}
    - {name: joint_head_yaw, rule: fixed, value: 0.0}
    - {name: joint_head_pitch, rule: fixed, value: 0.6708}
    - {name: left_arm_joint1, rule: fixed, value: -1.0817}
    - {name: left_arm_joint2, rule: fixed, value: 0.5907}
    - {name: left_arm_joint3, rule: fixed, value: 0.3442}
    - {name: left_arm_joint4, rule: fixed, value: -1.2819}
    - {name: left_arm_joint5, rule: fixed, value: 0.6928}
    - {name: left_arm_joint6, rule: fixed, value: 0.7}
    - {name: left_arm_joint7, rule: fixed, value: 0.0}

# Lula uses collision spheres to define the robot geometry in order to avoid
# collisions with external obstacles.  If no spheres are specified, Lula will
# not be able to avoid obstacles.

collision_spheres:
  - Link1_r:
    - "center": [0.0, 0.0, 0.0]
      "radius": 0.06
    - "center": [0.0, -0.0, 0.06]
      "radius": 0.04
    - "center": [0.0, -0.0, 0.107]
      "radius": 0.05
  - Link2_r:
    - "center": [0.0, -0.097, -0.0]
      "radius": 0.06
    - "center": [0.0, -0.044, -0.0]
      "radius": 0.07
  - Link3_r:
    - "center": [0.0, 0.0, 0.0]
      "radius": 0.06
    - "center": [-0.0, 0.0, -0.153]
      "radius": 0.06
    - "center": [-0.0, 0.0, -0.089]
      "radius": 0.05
  - Link4_r:
    - "center": [0.0, 0.067, -0.0]
      "radius": 0.07
  - Link5_r:
    - "center": [-0.0, -0.0, -0.01]
      "radius": 0.05
    - "center": [-0.0, -0.0, -0.066]
      "radius": 0.05
  - Link6_r:
    - "center": [-0.0, -0.046, 0.0]
      "radius": 0.05
    - "center": [-0.0, -0.103, 0.0]
      "radius": 0.05
  - Link7_r:
    - "center": [0.0, 0.0, -0.021]
      "radius": 0.045
    - "center": [-0.0, 0.0, 0.098]
      "radius": 0.045
    - "center": [-0.0, 0.0, 0.019]
      "radius": 0.045
    - "center": [-0.0, 0.0, 0.059]
      "radius": 0.045
  - right_base_link:
    - "center": [0.005, -0.038, -0.002]
      "radius": 0.05
    - "center": [0.009, -0.094, 0.066]
      "radius": 0.05
    - "center": [0.049, -0.0, 0.183]
      "radius": 0.03
    - "center": [-0.051, -0.0, 0.184]
      "radius": 0.03
    - "center": [0.056, -0.0, 0.148]
      "radius": 0.03
    - "center": [0.042, -0.0, 0.105]
      "radius": 0.03
    - "center": [-0.041, -0.0, 0.112]
      "radius": 0.03
    - "center": [-0.06, -0.0, 0.149]
      "radius": 0.03
