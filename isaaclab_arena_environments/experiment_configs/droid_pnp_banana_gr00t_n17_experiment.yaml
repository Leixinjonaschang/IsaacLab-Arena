runs:
  droid_pnp_banana_gr00t_n17:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      pick_up_object: banana_ycb_robolab
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
    environment_builder:
      language_instruction: Pick up the banana and place it in the bowl.
    policy:
      # GR00T N1.7 against the N1.7 DROID contract: 2-frame video history plus the eef_9d state.
      # The server converts the model's relative end-effector and joint actions back to absolute
      # ones, so the absolute droid_abs_joint_pos action space consumes them directly.
      type: isaaclab_arena_gr00t.policy.gr00t_remote_closedloop_policy.Gr00tRemoteClosedloopPolicy
      policy_config_yaml_path: isaaclab_arena_gr00t/policy/config/droid_manip_n17_gr00t_closedloop_config.yaml
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 5556
    rollout_limit:
      num_episodes: 3
